{{ if not (.Page.Scratch.Get "graphviz") }}
<script src="https://unpkg.com/@viz-js/viz@3.4.0/lib/viz-standalone.js"></script>
{{ .Page.Scratch.Set "graphviz" true }}
{{ end }}

<div class="graphviz-diagram{{ with .Get "class" }} {{ . }}{{ end }}">
  <script type="text/graphviz">
    {{- .Inner -}}
  </script>
</div>

<script>
(function() {
  // This script is emitted once per diagram, and each copy scans every
  // diagram on the page. Rendering is asynchronous, so a later copy used to
  // find the first diagram still without an SVG and render it a second time.
  // Claim each container synchronously, before the render is scheduled, so
  // every diagram is rendered exactly once.
  document.querySelectorAll('.graphviz-diagram').forEach(container => {
    if (container.dataset.graphviz) return;
    const script = container.querySelector('script[type="text/graphviz"]');
    if (!script) return;
    container.dataset.graphviz = 'rendering';
    Viz.instance().then(viz => {
      container.appendChild(viz.renderSVGElement(script.textContent));
      script.remove();
      container.dataset.graphviz = 'rendered';
    });
  });
})();
</script>
