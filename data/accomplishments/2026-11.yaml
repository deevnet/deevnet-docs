# November 2026, in progress. Written from the month's waypoints; each bullet names the roadmap items it rolls up.
through: "2026-11-27"
reached: 38
headline: "The site's secrets got harder to reach, tenants got more ways to stand on their own, and the site began telling its operator what needs patching."
bullets:
  - text: "**The tenant backend now goes home three ways: on a Pi, as a virtual machine, or installed on an owner's own computer.** The take-home Pi image reached the tenant downloads on Deevnet certificates or an owner's own (Nov 8), then gained metrics, alerts and buckets, verified on a real Pi (Nov 16). The same backend, from the same configuration, became a virtual machine image and an installer ISO (CHG-0074, CHG-0075, Nov 17). The virtual machine then ran under VirtualBox, Hyper-V and UTM on Apple Silicon (CHG-0076, CHG-0077, Nov 18)."
    items: [infrastructure/tenant-services/take-home-media, infrastructure/tenant-services/tenant-pki, infrastructure/tenant-services/observability]
  - text: "**The site now reports what it runs, what is waiting to be patched, and what has stopped.** A dated report compares every system's installed versions with the catalog (Patch Management v1, Nov 23). An update watcher and a health watcher on the Builder show both at login (CHG-0082, CHG-0086, Nov 24). The management hypervisor moved to Proxmox 9 (Nov 21), and the first patch passes brought both hypervisors and the core router current by Nov 27. After the API VM's disk controller panicked under load (INC-0006, Nov 20), every VM was moved to one hardware profile that the builders apply and check (ADR-0046, accepted Nov 27)."
    items: [infrastructure/substrate/patch-management, site-work/mobile/hypervisor-uplift]
  - text: "**Tenants got the services an app expects, and can stand more on their own.** Each tenant now has its own runtime secrets, S3 buckets, metrics, and alerts on a phone (Nov 14 to 15). Tenants can work from Windows laptops, get back into their own state with a new key, and be removed leaving nothing behind (Nov 7 to 12). The boundary between tenants and the site is one specification (Nov 1)."
    items: [infrastructure/tenant-services/platform-services, infrastructure/tenant-services/observability, infrastructure/tenant-services/tenant-lifecycle, /projects/archive/tenant-removal]
  - text: "**The site's secrets got harder to reach.** OpenBao is sealed between work sessions and opens only with split-key shares (CHG-0053, Nov 8). Builds no longer read it (Nov 13), it refuses certificates for the site's own names (Nov 7), and every long-lived credential is listed under a written policy (Nov 3)."
    items: [infrastructure/substrate/secrets-identity, infrastructure/substrate/credential-rotation, infrastructure/tenant-services/tenant-pki]
  - text: "**The site is easier to restore and to account for.** The core router was restored from its backup in a rehearsal, and the network devices back themselves up after every change (Nov 11). The router now meets the tenant overlay through one transit network (Nov 12), and the site's own software is cataloged, pinned and checked on every pull request (Nov 3)."
    items: [infrastructure/substrate/management-plane, infrastructure/tenant-services/tenant-fabric, infrastructure/substrate/patch-management, infrastructure/substrate/network-automation]
  - text: "**EdS moved to names not tied to a site.** Its certificates were reissued, its console answers at `console.eds.deevnet.net`, and its home Pi was rebuilt with all of its back end (Nov 1)."
    items: [infrastructure/tenant-services/tenant-pki, eds/eds/screens-console, eds/eds/platform]
next: "Patch Management v2 closes once the Wi-Fi controller gives the watcher a view-only client; then upstream releases and advisories (v3) and a monthly patch cycle (v4). The take-home tool is being renamed tenant2backend (CHG-0078), and the provisioning toolchain still has to be aligned to Proxmox 9."
watch: "The core router's hangs remain open (INC-0004, INC-0005). INC-0006 is mitigated, with preventive actions still open."
