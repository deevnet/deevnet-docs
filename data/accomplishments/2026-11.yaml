# November 2026, in progress. Written from the month's waypoints; each bullet names the roadmap items it rolls up.
through: "2026-11-09"
reached: 14
headline: "The site's secrets got harder to reach, and tenants got more ways to stand on their own."
bullets:
  - text: "**EdS moved to names not tied to a site.** Its certificates were reissued (CHG-0055), its console answers at `console.eds.deevnet.net`, and its home Pi was rebuilt with all of its back end (Nov 1)."
    items: [infrastructure/tenant-services/tenant-pki, eds/eds/screens-console, eds/eds/platform]
  - text: "**OpenBao is sealed between work sessions.** It now opens only with two of three split-key shares (CHG-0053, Nov 8). Every long-lived credential is listed with what it unlocks, under a written policy for an exposed one (Nov 3)."
    items: [infrastructure/substrate/secrets-identity, infrastructure/substrate/credential-rotation]
  - text: "**Tenant certificates got stricter and easier to take home.** The secret store itself refuses certificates for the site's or the platform's own names (CHG-0059, Nov 7), and the take-home Pi image is in the tenant downloads, on Deevnet certificates by default or an owner's own starter kit (Nov 8)."
    items: [infrastructure/tenant-services/tenant-pki]
  - text: "**Tenants can stand more on their own.** The boundary between tenants and the site is one specification (Nov 1); tenants can work from Windows laptops (CHG-0058, Nov 7); and a tenant that loses the keys to its own state gets back in with a new one from the operator (CHG-0060, Nov 9)."
    items: [infrastructure/tenant-services/tenant-lifecycle, infrastructure/tenant-services/platform-services]
  - text: "**The site's own software is easier to account for.** The Software Catalog became a data file reports can compare against, Deevnet's own software is pinned and licensed, and the automation repositories are checked on every pull request (Nov 3)."
    items: [infrastructure/substrate/software-discovery, infrastructure/substrate/network-automation]
next: "Devices' own certificates through the Deevnet API, builds off OpenBao (CHG-0037, under way), and a tenant rebuilt from its own code in a drill."
watch: "The core router's hangs remain open (INC-0004, INC-0005). Backups still run to one flash drive; the second drive is outstanding (CHG-0039)."
