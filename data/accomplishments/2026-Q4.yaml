# Q4 2026. Written from its months.
through: "2026-11-13"
reached: 80
headline: "Deevnet is its own certificate authority, and its first production tenant is in daily use."
bullets:
  - text: "**Deevnet is its own certificate authority,** from an offline root down to tenants' services and their Pis. Every substrate service, appliance and tenant tool now trusts that root."
    items: [infrastructure/substrate/tls-cert-automation, infrastructure/tenant-services/tenant-pki, infrastructure/substrate/secrets-identity]
  - text: "**EdS, the first production tenant, is in daily use:** lights, screens, now playing from the turntable, iTunes and Spotify, and voice control."
    items: [eds/eds/stand, eds/eds/now-playing, eds/eds/voice, eds/eds/devices, eds/eds/screens-console, eds/eds/platform, eds/eds/operations]
  - text: "**Tenants can rely on more of the platform:** fixed addresses for their devices and their services on 443 by name. MaBell now sends its events as a tenant. Tenants can work from Windows laptops, one that loses its state's keys gets back in with a new one, and one that is removed leaves nothing behind."
    items: [infrastructure/tenant-services/platform-services, infrastructure/tenant-services/tenant-lifecycle, /projects/archive/tenant-removal, mabell]
  - text: "**The platform is safer to operate:** credentials rotated, every public repository scanned, nightly encrypted backups with one restore rehearsed. The secrets manager stays sealed until an operator opens it with split-key shares. The core router has been restored from its backup, and the network devices are backed up after every change."
    items: [infrastructure/substrate/credential-rotation, infrastructure/substrate/management-plane, infrastructure/substrate/secrets-identity, infrastructure/substrate/software-discovery, infrastructure/tenant-services/tenant-fabric]
  - text: "**A second product started:** a catalog of the owner's music, which EdS already uses."
    items: [eds/inventory/foundation, eds/inventory/serving-eds, eds/inventory/schema]
watch: "The mobile site's core router is unreliable under large transfers. It failed twice this quarter, the fault is not fixed, and its replacement is not chosen."
