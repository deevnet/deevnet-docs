# The Software Catalog's rows: content/docs/platforms/software-catalog.md draws
# each table with {{< software-table "<id>" >}}, its columns in order. Cells are
# markdown, as they read on the page; a cell left out is drawn empty. A report
# compares against `version` and `source` by the component, plugin or
# repository's name. When a change upgrades something, it edits the row here.
tables:
  core-router:
    columns:
    - key: component
      title: Component
    - key: version
      title: Version
    - key: license
      title: License
    - key: support
      title: Support
    - key: source
      title: Version source
    rows:
    - component: '**OPNsense**'
      version: '**26.7.3_11**'
      license: BSD-2-Clause
      support: Community, commercial available (Deciso)
      source: Observed 2026-09-19 ([CHG-0007](/docs/changes/2026/0007-core-router-zone-policy/)) and 2026-09-21 ([INC-0004](/docs/incidents/2026/0004-core-router-lost/))
    - component: FreeBSD base
      version: not recorded
      license: BSD-2-Clause
      support: Bundled
      source: Bundled with OPNsense
  core-router-services:
    columns:
    - key: service
      title: Service
    - key: used_for
      title: Used for
    - key: license
      title: License
    - key: configured_by
      title: Configured by
    rows:
    - service: '**Kea DHCPv4**'
      used_for: DHCP on every segment, and static reservations. ISC dhcpd and dnsmasq are not used on the router.
      license: MPL-2.0
      configured_by: '`opnsense_dhcp` (`/api/kea/…`)'
    - service: '**Unbound**'
      used_for: 'The site resolver: host overrides, aliases, and forwarding of tenant zones to PowerDNS'
      license: BSD-3-Clause
      configured_by: '`opnsense_dns` (`/api/unbound/…`)'
    - service: '**pf** (through the OPNsense filter and alias APIs)'
      used_for: Zone policy, and the `deevnet_private` alias
      license: BSD
      configured_by: '`opnsense_firewall` (`/api/firewall/…`)'
    - service: VLAN interfaces
      used_for: One per segment, on `re0`
      license: BSD-2-Clause
      configured_by: '`opnsense_vlans` (`/api/interfaces/…`)'
    - service: Gateways and static routes
      used_for: The tenant fabric route `10.20.128.0/18`
      license: BSD-2-Clause
      configured_by: '`opnsense_routes` (`/api/routing/…`, `/api/routes/…`)'
    - service: Configuration backup
      used_for: Pre-change backups
      license: BSD-2-Clause
      configured_by: Migration playbooks (`/api/core/backup/…`)
  core-router-plugins:
    columns:
    - key: plugin
      title: Plugin
    - key: state
      title: State
    - key: license
      title: License
    - key: notes
      title: Notes
    rows:
    - plugin: '`os-wol`'
      state: Required, but whether it is installed is not recorded
      license: BSD-2-Clause
      notes: Wake-on-LAN for the Builder and both hypervisors (`opnsense_wol`)
    - plugin: '`os-realtek-re`'
